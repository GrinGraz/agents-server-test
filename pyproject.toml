[project]
name = "agents-server-test"
version = "0.1.0"
description = "Sandbox local para aprender LangChain y LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic",
    "langgraph>=1.0",
    "python-dotenv",
]

[project.optional-dependencies]
ollama = ["langchain-ollama"]

[dependency-groups]
dev = ["pytest", "ruff", "langgraph-cli[inmem]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
